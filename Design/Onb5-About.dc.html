<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@media (prefers-reduced-motion: no-preference){@keyframes vRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes vDraw{from{stroke-dasharray:0 1200}}@keyframes vLine{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}@keyframes vGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes vPop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.2)}100%{transform:scale(1)}}@keyframes vDock{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}@keyframes vBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}header,section,h1,h1+p{animation:vRise .6s cubic-bezier(.22,1,.36,1) both}h1+p{animation-delay:.12s}section:nth-of-type(2){animation-delay:0.19s}section:nth-of-type(3){animation-delay:0.26s}section:nth-of-type(4){animation-delay:0.33s}section:nth-of-type(5){animation-delay:0.40s}section:nth-of-type(6){animation-delay:0.47s}section:nth-of-type(7){animation-delay:0.54s}section:nth-of-type(8){animation-delay:0.61s}section:nth-of-type(9){animation-delay:0.68s}circle[stroke-linecap="round"][stroke-dasharray]{animation:vDraw 1.4s cubic-bezier(.22,1,.36,1) .25s both}path[fill="none"][stroke-linejoin="round"]{stroke-dasharray:1600;animation:vLine 1.8s cubic-bezier(.4,0,.2,1) .3s both}[style*="align-items: end"]>div{transform-origin:50% 100%;animation:vGrow .9s cubic-bezier(.22,1,.36,1) .3s both}circle[r="5"][fill="#FFFFFF"]{transform-box:fill-box;transform-origin:center;animation:vPop .55s 1.6s both}svg[aria-label^="Three rings"]{animation:vBreath 4.5s ease-in-out 1.6s infinite}nav[aria-label="Tabs"]{animation:vDock .7s cubic-bezier(.22,1,.36,1) .2s both}a,button{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .2s}a:active,button:active{transform:scale(.96)}}
a{color:#12141A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2FA; font-family: 'Figtree', system-ui, -apple-system, sans-serif; color: #12141A; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

  <div style="position: absolute; top: 62px; left: 16px; right: 24px; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 14px">
    <a href="Onb4-Health.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(18,20,26,0.06); display: flex; align-items: center; justify-content: center; color: #12141A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div aria-label="Step 2 of 4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 5px; border-radius: 3px; background: #12141A"></span><span style="height: 5px; border-radius: 3px; background: #12141A"></span><span style="height: 5px; border-radius: 3px; background: #D5D8DE"></span><span style="height: 5px; border-radius: 3px; background: #D5D8DE"></span></div>
  </div>

  <div style="position: absolute; top: 128px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #646A78">Step 2 of 4</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1">About you</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; font-weight: 500; color: #4A505C">We filled in what Health already knows. Check it looks right.</p>
  </div>

  <div style="position: absolute; top: 254px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); padding: 0 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid #EEEFF2">
        <label for="age" style="font-size: 16px; font-weight: 650">Age</label>
        <div style="display: flex; align-items: center; gap: 6px"><input id="age" type="number" value="21" style="width: 56px; height: 36px; border: 0; border-radius: 10px; background: #F4F2FA; text-align: center; font-family: inherit; font-size: 16px; font-weight: 700; color: #12141A"><span style="font-size: 15px; font-weight: 600; color: #646A78">years</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid #EEEFF2">
        <span id="sexLabel" style="font-size: 16px; font-weight: 650">Sex</span>
        <div role="radiogroup" aria-labelledby="sexLabel" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: #F4F2FA; border-radius: 13px; padding: 3px">
          <sc-for list="{{sexes}}" as="o" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 38px; border: 0; border-radius: 10px; background: {{o.bg}}; box-shadow: {{o.sh}}; font-family: inherit; font-size: 14px; font-weight: 700; color: #12141A; padding: 0">{{o.k}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px">
        <div style="display: flex; flex-direction: column; gap: 1px"><label for="weight" style="font-size: 16px; font-weight: 650">Body weight</label><span style="font-size: 12.5px; font-weight: 600; color: #646A78">From Health · Oct 17</span></div>
        <div style="display: flex; align-items: center; gap: 6px"><input id="weight" type="text" value="{{weight}}" style="width: 66px; height: 36px; border: 0; border-radius: 10px; background: #F4F2FA; text-align: center; font-family: inherit; font-size: 16px; font-weight: 700; color: #12141A"><span style="font-size: 15px; font-weight: 600; color: #646A78; min-width: 18px">{{wUnit}}</span></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span id="unitsLabel" style="font-size: 16px; font-weight: 650">Units</span>
      <div role="radiogroup" aria-labelledby="unitsLabel" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; background: #F4F2FA; border-radius: 13px; padding: 3px">
        <sc-for list="{{units}}" as="o" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 38px; border: 0; border-radius: 10px; background: {{o.bg}}; box-shadow: {{o.sh}}; font-family: inherit; font-size: 14px; font-weight: 700; color: #12141A; padding: 0">{{o.k}}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between"><span id="hrLabel" style="font-size: 16px; font-weight: 650">Max heart rate</span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 700">{{maxHr}} <span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #646A78">bpm</span></span></div>
      <div role="radiogroup" aria-labelledby="hrLabel" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; background: #F4F2FA; border-radius: 13px; padding: 3px">
        <sc-for list="{{hrModes}}" as="o" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 38px; border: 0; border-radius: 10px; background: {{o.bg}}; box-shadow: {{o.sh}}; font-family: inherit; font-size: 14px; font-weight: 700; color: #12141A; padding: 0">{{o.k}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #646A78; line-height: 1.4">{{hrNote}}</span>
    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px">
    <a href="Onb6-Goals.dc.html" style="width: 100%; height: 56px; border-radius: 28px; background: #6B4EFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sex: 'Male', units: 'metric', hr: 'auto' }; }
  seg(keys, cur, field, labels) {
    var self = this;
    return keys.map(function (k, i) {
      var on = k === cur;
      return { k: labels ? labels[i] : k, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', sh: on ? '0 1px 3px rgba(18,20,26,0.12)' : 'none', pick: function () { var o = {}; o[field] = k; self.setState(o); } };
    });
  }
  renderVals() {
    var metric = this.state.units === 'metric';
    var auto = this.state.hr === 'auto';
    return {
      sexes: this.seg(['Female', 'Male', 'Other'], this.state.sex, 'sex'),
      units: this.seg(['metric', 'imperial'], this.state.units, 'units', ['kg · km', 'lb · mi']),
      hrModes: this.seg(['auto', 'manual'], this.state.hr, 'hr', ['Estimate for me', 'Enter my own']),
      weight: metric ? '78.4' : '172.8', wUnit: metric ? 'kg' : 'lb',
      maxHr: auto ? '193' : '198',
      hrNote: auto ? 'Estimated from your age. Vigil refines it when a workout shows a higher peak.' : 'Use a value from a lab test or a recent all-out effort.'
    };
  }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vigil · Progress · Body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@media (prefers-reduced-motion: no-preference){@keyframes vRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes vDraw{from{stroke-dasharray:0 1200}}@keyframes vLine{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}@keyframes vGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes vPop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.2)}100%{transform:scale(1)}}@keyframes vDock{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}@keyframes vBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}header,section,h1,h1+p{animation:vRise .6s cubic-bezier(.22,1,.36,1) both}h1+p{animation-delay:.12s}section:nth-of-type(2){animation-delay:0.19s}section:nth-of-type(3){animation-delay:0.26s}section:nth-of-type(4){animation-delay:0.33s}section:nth-of-type(5){animation-delay:0.40s}section:nth-of-type(6){animation-delay:0.47s}section:nth-of-type(7){animation-delay:0.54s}section:nth-of-type(8){animation-delay:0.61s}section:nth-of-type(9){animation-delay:0.68s}circle[stroke-linecap="round"][stroke-dasharray]{animation:vDraw 1.4s cubic-bezier(.22,1,.36,1) .25s both}path[fill="none"][stroke-linejoin="round"]{stroke-dasharray:1600;animation:vLine 1.8s cubic-bezier(.4,0,.2,1) .3s both}[style*="align-items: end"]>div{transform-origin:50% 100%;animation:vGrow .9s cubic-bezier(.22,1,.36,1) .3s both}circle[r="5"][fill="#FFFFFF"]{transform-box:fill-box;transform-origin:center;animation:vPop .55s 1.6s both}svg[aria-label^="Three rings"]{animation:vBreath 4.5s ease-in-out 1.6s infinite}nav[aria-label="Tabs"]{animation:vDock .7s cubic-bezier(.22,1,.36,1) .2s both}a,button{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .2s}a:active,button:active{transform:scale(.96)}}
a{color:#12141A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 1320px; position: relative; overflow: hidden; background: #F4F2FA; font-family: 'Figtree', system-ui, -apple-system, sans-serif; color: #12141A; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

  <header style="padding: 58px 20px 0">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Progress</h1>
  </header>

  <nav aria-label="Progress area" style="margin: 14px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: #E4E6EA; border-radius: 16px; padding: 4px">
    <a href="ProgressRun.dc.html" style="height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 650; text-decoration: none; color: #4A505C">Running</a>
    <a href="ProgressLift.dc.html" style="height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 650; text-decoration: none; color: #4A505C">Lifting</a>
    <a href="ProgressBody.dc.html" aria-current="page" style="height: 40px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,20,26,0.12); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 750; text-decoration: none; color: #12141A">Body</a>
  </nav>

  <div role="radiogroup" aria-label="Time range" style="margin: 12px 16px 0; display: flex; gap: 8px">
    <button role="radio" aria-checked="false" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #FFFFFF; color: #12141A; box-shadow: 0 0 0 1px rgba(18,20,26,0.07); font-family: inherit; font-size: 14px; font-weight: 700; padding: 0">4W</button>
    <button role="radio" aria-checked="true" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #12141A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0">3M</button>
    <button role="radio" aria-checked="false" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #FFFFFF; color: #12141A; box-shadow: 0 0 0 1px rgba(18,20,26,0.07); font-family: inherit; font-size: 14px; font-weight: 700; padding: 0">6M</button>
    <button role="radio" aria-checked="false" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #FFFFFF; color: #12141A; box-shadow: 0 0 0 1px rgba(18,20,26,0.07); font-family: inherit; font-size: 14px; font-weight: 700; padding: 0">1Y</button>
  </div>

  <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <a href="Metric.dc.html" aria-label="{{c.label}}" style="margin: 14px 16px 0; background: #FFFFFF; border-radius: 24px; padding: 18px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #12141A">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700; color: #646A78">{{c.name}}</span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 700">{{c.value}} <span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #646A78">{{c.unit}}</span></span></div>
        <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.chipBg}}; color: {{c.chipFg}}; display: flex; align-items: center; font-size: 13px; font-weight: 750">{{c.delta}}</span>
      </div>
      <svg width="322" height="84" viewBox="0 0 322 84" aria-hidden="true"><rect x="0" y="{{c.bandY}}" width="322" height="{{c.bandH}}" fill="{{c.band}}"></rect><path d="{{c.path}}" fill="none" stroke="{{c.color}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="318" cy="{{c.endY}}" r="5" fill="#FFFFFF" stroke="{{c.color}}" stroke-width="3"></circle></svg>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 650; color: #646A78"><span>Jul 20</span><span>Sep 1</span><span>Oct 19</span></div>
    </a>
  </sc-for>

  <section aria-label="Recovery vs training load" style="margin: 14px 16px 0; background: #FFFFFF; border-radius: 24px; padding: 18px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 3px"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 700">Recovery vs. training load</h2><span style="font-size: 13px; font-weight: 600; color: #646A78">Last 30 days · recovery dips after heavy days</span></div>
    <div style="position: relative; height: 160px">
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; align-items: end">
        <sc-for list="{{load}}" as="l" hint-placeholder-count="30"><div style="height: {{l}}; border-radius: 3px; background: #FBD3BC"></div></sc-for>
      </div>
      <svg width="322" height="160" viewBox="0 0 322 160" aria-hidden="true" style="position: absolute; inset: 0"><path d="{{recLine}}" fill="none" stroke="#157A40" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 650; color: #646A78"><span>Sep 20</span><span>Oct 5</span><span>Oct 19</span></div>
    <div style="display: flex; gap: 16px; font-size: 12.5px; font-weight: 650; color: #4A505C">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 3px; border-radius: 2px; background: #157A40"></span>Recovery %</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FBD3BC"></span>Daily training load</span>
    </div>
  </section>

  <nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 66px; border-radius: 33px; background: rgba(255,255,255,0.82); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(18,20,26,0.12), 0 0 0 1px rgba(18,20,26,0.06); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 2px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5a8.5 8.5 0 1 1 15 0"></path><path d="M12 13l4-4"></path><circle cx="12" cy="13.5" r="1.5"></circle></svg>Today</a>
    <a href="Sleep.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>Sleep</a>
    <a href="TrainRun.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>Train</a>
    <a href="ProgressRun.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; background: rgba(123,97,255,0.16); color: #4B32D6; text-decoration: none; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Progress</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  gen(seed, n, base, amp, drift, last) {
    var s = seed, out = [];
    for (var i = 0; i < n; i++) { s = (s * 9301 + 49297) % 233280; out.push(base + drift * i / (n - 1) + Math.sin(i / 3 + seed) * amp * 0.5 + (s / 233280 - 0.5) * amp); }
    out[n - 1] = last; return out;
  }
  card(name, unit, label, vals, lo, hi, bandLo, bandHi, color, band, delta, good) {
    var Y = function (v) { return 84 - (v - lo) / (hi - lo) * 84; };
    var path = vals.map(function (v, i) { return (i ? 'L' : 'M') + (4 + i * 314 / (vals.length - 1)).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    return { name: name, unit: unit, label: label, value: String(vals[vals.length - 1]), path: path, endY: Y(vals[vals.length - 1]).toFixed(1), color: color, band: band, bandY: Y(bandHi).toFixed(1), bandH: (Y(bandLo) - Y(bandHi)).toFixed(1), delta: delta, chipBg: good ? '#DCF6E8' : '#F4F2FA', chipFg: good ? '#157A40' : '#4A505C' };
  }
  renderVals() {
    var w = this.gen(3, 40, 79.6, 0.8, -1.2, 78.4).map(function (v) { return Math.round(v * 10) / 10; });
    var rhr = this.gen(5, 40, 55, 3, -2.5, 52).map(function (v) { return Math.round(v); });
    var hrv = this.gen(8, 40, 58, 10, 6, 68).map(function (v) { return Math.round(v); });
    var cards = [
      this.card('Body weight', 'kg', 'Body weight trend', w, 76.5, 81.5, 0, 0, '#2E7CF6', 'transparent', '−1.2 kg', false),
      this.card('Resting heart rate', 'bpm', 'Resting heart rate trend', rhr, 46, 62, 53, 57, '#E5484D', '#FCECEC', '−3 bpm', true),
      this.card('HRV', 'ms', 'HRV trend', hrv, 40, 85, 55, 67, '#1DB872', '#EAF6EE', '+6 ms', true)
    ];
    var s = 4, load = [], rec = [], prevLoad = 40;
    for (var i = 0; i < 30; i++) {
      s = (s * 9301 + 49297) % 233280; var r = s / 233280;
      var l = i % 7 === 5 ? 8 : 30 + r * 90;
      var rv = Math.max(25, Math.min(95, 88 - prevLoad * 0.35 + (r - 0.5) * 16));
      load.push(Math.round(l / 130 * 160) + 'px'); rec.push(rv); prevLoad = l;
    }
    rec[29] = 78;
    var recLine = rec.map(function (v, i) { return (i ? 'L' : 'M') + (5 + i * 312 / 29).toFixed(1) + ' ' + (160 - v / 100 * 160).toFixed(1); }).join(' ');
    return { cards: cards, load: load, recLine: recLine };
  }
}
</script>
</body>
</html>

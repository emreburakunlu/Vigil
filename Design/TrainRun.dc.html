<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vigil · Train · Run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@media (prefers-reduced-motion: no-preference){@keyframes vRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes vDraw{from{stroke-dasharray:0 1200}}@keyframes vLine{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}@keyframes vGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes vPop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.2)}100%{transform:scale(1)}}@keyframes vDock{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}@keyframes vBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}header,section,h1,h1+p{animation:vRise .6s cubic-bezier(.22,1,.36,1) both}h1+p{animation-delay:.12s}section:nth-of-type(2){animation-delay:0.19s}section:nth-of-type(3){animation-delay:0.26s}section:nth-of-type(4){animation-delay:0.33s}section:nth-of-type(5){animation-delay:0.40s}section:nth-of-type(6){animation-delay:0.47s}section:nth-of-type(7){animation-delay:0.54s}section:nth-of-type(8){animation-delay:0.61s}section:nth-of-type(9){animation-delay:0.68s}circle[stroke-linecap="round"][stroke-dasharray]{animation:vDraw 1.4s cubic-bezier(.22,1,.36,1) .25s both}path[fill="none"][stroke-linejoin="round"]{stroke-dasharray:1600;animation:vLine 1.8s cubic-bezier(.4,0,.2,1) .3s both}[style*="align-items: end"]>div{transform-origin:50% 100%;animation:vGrow .9s cubic-bezier(.22,1,.36,1) .3s both}circle[r="5"][fill="#FFFFFF"]{transform-box:fill-box;transform-origin:center;animation:vPop .55s 1.6s both}svg[aria-label^="Three rings"]{animation:vBreath 4.5s ease-in-out 1.6s infinite}nav[aria-label="Tabs"]{animation:vDock .7s cubic-bezier(.22,1,.36,1) .2s both}a,button{transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .2s}a:active,button:active{transform:scale(.96)}}
a{color:#12141A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 1320px; position: relative; overflow: hidden; background: #F4F2FA; font-family: 'Figtree', system-ui, -apple-system, sans-serif; color: #12141A; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

  <header style="padding: 58px 20px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Train</h1>
  </header>

  <nav aria-label="Workout type" style="margin: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; background: #E4E6EA; border-radius: 16px; padding: 4px">
    <a href="TrainRun.dc.html" aria-current="page" style="height: 40px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,20,26,0.12); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 750; text-decoration: none; color: #12141A">Run</a>
    <a href="TrainLift.dc.html" style="height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 650; text-decoration: none; color: #4A505C">Lift</a>
  </nav>

  <section aria-label="Last 7 days" style="margin: 16px 16px 0; background: #FFFFFF; border-radius: 26px; padding: 18px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 700">Last 7 days</h2><span style="font-size: 13px; font-weight: 600; color: #646A78">Oct 13 – 19</span></div>
    <div style="display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; font-weight: 650; color: #646A78">Distance</span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">18.4 <span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #646A78">/ 25 km</span></span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; font-weight: 650; color: #646A78">Time</span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">1:38</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; font-weight: 650; color: #646A78">Runs</span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">3</span></div>
    </div>
    <div style="height: 10px; border-radius: 5px; background: #ECE9F5; overflow: hidden"><div style="width: 74%; height: 10px; border-radius: 5px; background: #2E7CF6"></div></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; height: 110px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 110px">
          <span style="font-size: 11.5px; font-weight: 700; color: #4A505C">{{d.v}}</span>
          <div style="width: 100%; height: {{d.h}}; border-radius: 6px; background: {{d.c}}"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; text-align: center; font-size: 12px; font-weight: 700; color: #646A78; margin-top: -8px"><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span><span>M</span></div>
  </section>

  <section aria-label="Runs" style="margin: 28px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 21px; font-weight: 700">Runs</h2>
      <span style="font-size: 13px; font-weight: 600; color: #646A78">From Apple Health</span>
    </div>
    <sc-for list="{{runs}}" as="r" hint-placeholder-count="6">
      <a href="RunDetail.dc.html" style="display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; padding: 12px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(18,20,26,0.04), 0 0 0 1px rgba(18,20,26,0.05); text-decoration: none; color: #12141A">
        <div style="width: 76px; height: 76px; border-radius: 16px; background: #E7F0FF; overflow: hidden">
          <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><path d="M0 25H76M0 51H76M25 0V76M51 0V76" stroke="#D6E3F5" stroke-width="1"></path><path d="M10 64L30 50M46 0L58 76" stroke="#FFFFFF" stroke-width="4"></path><path d="{{r.route}}" fill="none" stroke="#2E7CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px"><span style="font-size: 15.5px; font-weight: 750">{{r.name}}</span><span style="font-size: 13px; font-weight: 600; color: #646A78; white-space: nowrap">{{r.date}}</span></div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 4px">
            <div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 750">{{r.dist}}</span><span style="font-size: 11.5px; font-weight: 650; color: #646A78">km</span></div>
            <div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 750">{{r.time}}</span><span style="font-size: 11.5px; font-weight: 650; color: #646A78">time</span></div>
            <div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 750">{{r.pace}}</span><span style="font-size: 11.5px; font-weight: 650; color: #646A78">/km</span></div>
            <div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 750">{{r.hr}}</span><span style="font-size: 11.5px; font-weight: 650; color: #646A78">bpm</span></div>
          </div>
        </div>
      </a>
    </sc-for>
  </section>

  <nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 66px; border-radius: 33px; background: rgba(255,255,255,0.82); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(18,20,26,0.12), 0 0 0 1px rgba(18,20,26,0.06); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 2px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5a8.5 8.5 0 1 1 15 0"></path><path d="M12 13l4-4"></path><circle cx="12" cy="13.5" r="1.5"></circle></svg>Today</a>
    <a href="Sleep.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>Sleep</a>
    <a href="TrainRun.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; background: rgba(123,97,255,0.16); color: #4B32D6; text-decoration: none; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>Train</a>
    <a href="ProgressRun.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Progress</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #646A78; text-decoration: none; font-size: 11px; font-weight: 650"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  route(seed) {
    var s = seed, pts = [], n = 14;
    for (var i = 0; i < n; i++) {
      s = (s * 9301 + 49297) % 233280;
      var a = i / n * Math.PI * 2, r = 20 + (s / 233280) * 12;
      pts.push([38 + Math.cos(a) * r * 1.05, 38 + Math.sin(a) * r * 0.9]);
    }
    pts.push(pts[0]);
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  }
  renderVals() {
    var km = [5.2, 0, 5.16, 0, 0, 0, 8.04];
    var days = km.map(function (v, i) { return { v: v ? v.toFixed(1) : '', h: v ? Math.round(v / 9 * 86) + 'px' : '4px', c: v ? (i === 6 ? '#2E7CF6' : '#9EC2FF') : '#E4E6EA' }; });
    var self = this;
    var runs = [
      ['Outdoor Run', 'Today, 07:12', '8.04', '42:18', '5:16', '152'],
      ['Easy Run', 'Thu, Oct 15', '5.16', '28:40', '5:33', '144'],
      ['Tempo Run', 'Tue, Oct 13', '5.20', '27:51', '5:21', '158'],
      ['Long Run', 'Sat, Oct 10', '12.10', '1:07:24', '5:34', '151'],
      ['Easy Run', 'Thu, Oct 8', '6.02', '33:10', '5:31', '143'],
      ['Intervals', 'Tue, Oct 6', '7.20', '37:02', '5:09', '161']
    ].map(function (r, i) { return { name: r[0], date: r[1], dist: r[2], time: r[3], pace: r[4], hr: r[5], route: self.route(11 + i * 7) }; });
    return { days: days, runs: runs };
  }
}
</script>
</body>
</html>
